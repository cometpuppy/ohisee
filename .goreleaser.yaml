version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

brews:
  - name: ohisee
    repository:
      owner: cometpuppy
      name: homebrew-ohisee
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/cometpuppy/ohisee"
    description: "TUI Item Tracker for Dark Souls Remastered Item Randomizers"
    license: "MIT"
    install: |
      bin.install "ohisee"
    test: |
      system "#{bin}/ohisee", "--version"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: cometpuppy
    name: ohisee
